<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Suchmaschinen sollen die Offline-Seite nicht indexieren -->
  <meta name="robots" content="noindex, nofollow, noarchive">

  <meta name="theme-color" content="#05030a">

  <title>Rave3eN.de — Offline</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 25% 20%,
          rgba(91, 33, 182, 0.22),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(0, 174, 255, 0.18),
          transparent 38%
        ),
        #05030a;

      color: #ffffff;

      font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    /* Hintergrund-Leuchteffekte */

    .glow {
      position: fixed;

      width: 42vw;
      height: 42vw;

      border-radius: 50%;

      filter: blur(90px);

      opacity: 0.18;

      animation:
        drift 9s ease-in-out infinite alternate;

      pointer-events: none;
    }

    .glow.one {
      background: #8b5cf6;

      top: -18vw;
      left: -12vw;
    }

    .glow.two {
      background: #00b7ff;

      right: -16vw;
      bottom: -20vw;

      animation-delay: -3s;
    }

    /* Hauptbereich */

    main {
      position: relative;

      z-index: 2;

      width: min(900px, 90vw);

      text-align: center;

      padding: 56px 28px;
    }

    /* Rave3eN Schriftzug */

    .brand {
      font-size:
        clamp(2.7rem, 8vw, 6.5rem);

      font-weight: 900;

      letter-spacing: 0.08em;

      line-height: 0.95;

      /* WICHTIG:
         Kein uppercase, damit Rave3eN
         exakt so geschrieben bleibt.
      */

      text-transform: none;

      text-shadow:
        0 0 10px rgba(139, 92, 246, 0.65),
        0 0 30px rgba(0, 183, 255, 0.35);
    }

    /* Neon-Trennlinie */

    .line {
      width: min(420px, 65vw);

      height: 2px;

      margin: 30px auto;

      background:
        linear-gradient(
          90deg,
          transparent,
          #8b5cf6,
          #00b7ff,
          transparent
        );

      box-shadow:
        0 0 16px rgba(0, 183, 255, 0.55);
    }

    /* Offline Text */

    h1 {
      font-size:
        clamp(1.4rem, 3vw, 2.1rem);

      font-weight: 600;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    p {
      margin-top: 18px;

      color:
        rgba(255, 255, 255, 0.68);

      font-size:
        clamp(0.95rem, 2vw, 1.1rem);

      line-height: 1.7;
    }

    /* RAVE ON */

    .signature {
      margin-top: 42px;

      font-weight: 800;

      letter-spacing: 0.18em;

      color: #d8c8ff;
    }

    /* Status Punkt */

    .dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      margin-right: 10px;

      border-radius: 50%;

      background: #9b6cff;

      box-shadow:
        0 0 12px #9b6cff;

      animation:
        pulse 1.8s ease-in-out infinite;
    }

    /* Animationen */

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    @keyframes drift {

      from {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      to {
        transform:
          translate3d(8vw, 5vh, 0)
          scale(1.15);
      }
    }

  </style>
</head>

<body>

  <!-- Hintergrund -->
  <div class="glow one"></div>
  <div class="glow two"></div>

  <!-- Inhalt -->
  <main>

    <div class="brand">
      Rave3eN
    </div>

    <div class="line"></div>

    <h1>
      <span class="dot"></span>
      Aktuell offline
    </h1>

    <p>
      Diese Webseite ist derzeit nicht verfügbar.
    </p>

    <div class="signature">
      RAVE ON 💜💙
    </div>

  </main>

</body>
</html>
